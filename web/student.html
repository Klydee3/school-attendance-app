<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>Adsum: Кабинет ученика</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="icon.png">
	</head>
	<body>
		<div class="container">
			<h1>Кабинет ученика</h1>
			<div class="bubble">
				<p>Будете сегодня в школе?</p>
				<button class="btn btn-yes" id="btn-yes">Да</button>
				<button class="btn btn-no" id="btn-no">Нет</button>
				<input class="name-input" id="reason-input" type="text" placeholder="Причина отсутствия (если нет)">
			</div>
			<p id="message"></p>
		</div>
		<script src="layout.js"></script>
		<script src="student.js"></script>
	</body>
</html>
