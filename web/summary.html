<!DOCTYPE html>
<html lang="ru">
<head>
	<meta cahrset="UTF-8">
	<title>Adsum: Утренняя сводка</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="icon.png">
</head>
<body>
	<div class="container">
		<h1>Утренняя сводка</h1>
		<div>
			<input class="btn date-choise" type="date" id="summary-date">
			<button class="btn "id="show-btn">Показать</button>
			<button class="btn" id="csv-btn">Скачать CSV</button>
			<button class="btn" id="reasons-btn">Причины отсутствующих</button>
		</div>
		<table id="summary-table">
			<thead>
				<tr><th>Класс</th><th>Всего</th><th>Пришло</th><th>Не пришло</th><th>Не отметилось</th><th>Процент</th></tr>
			</thead>
			<tbody></tbody>
		</table>
		<p id="summary-total"></p>
		<p id="message"></p>
		<button class="btn" id="back-btn">Назад</button>
		<script src="layout.js"></script>
		<script src="summary.js"></script>
	</div>
</body>
</html>
