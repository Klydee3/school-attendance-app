<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>Adsum: Кабинет регистрации Главного Разработчика</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="icon.png">
	</head>
	<body>
		<div class="container">
			<h1>Введите необходимую информацию для регистрации ниже:</h1>
			<input class="name-input" id="devName" type="text" placeholder="Введите имя разработчика">
			<input class="name-input" id="devPass" type="password" placeholder="Введите пароль разработчика">
			<button class="btn btn-yes" id="regDev">Зарегистрировать</button>
			<p id="message"></p>
		</div>
		<script src="layout.js"></script>
		<script src="reg-dev.js"></script>
	</body>
</html>
