<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Adsum: Регистрация ученика</title>
    <link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div class="container">
        <h1>Регистрация ученика</h1>
        <input class="name-input" id="reg-surname" type="text" placeholder="Фамилия">
        <input class="name-input" id="reg-name" type="text" placeholder="Имя">
        <input class="name-input" id="reg-class" type="text" placeholder="Класс">
        <button class="btn" id="reg-student-btn">Зарегистрировать ученика</button>
        <button class="btn" id="back-btn">Назад</button>
        <p id="message"></p>
    </div>
    <script src="layout.js"></script>
    <script src="register-student.js"></script>
</body>
</html>
