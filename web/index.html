<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Школьная система</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <h1>Школьная система</h1>
        <div id="login-screen">
            <input class="name-input" id="login-input" type="text" placeholder="Логин">
            <input class="name-input" id="password-input" type="password" placeholder="Пароль">
            <button class="btn btn-yes" id="login-btn">Войти</button>
        </div>
        <div id="student-screen" style="display:none">
            <p>Будете сегодня в школе?</p>
            <button class="btn btn-yes" id="btn-yes">Да</button>
            <button class="btn btn-no" id="btn-no">Нет</button>
        </div>
        <div id="teacher-screen" style="display:none">
            <h2>Кабинет сотрудника</h2>
            <div id="pending-list"></div>
        </div>
        <div id="admin-screen" style="display:none">
            <h2>Кабинет администратора</h2>
            <input class="name-input" id="reg-surname" type="text" placeholder="Фамилия">
            <input class="name-input" id="reg-name" type="text" placeholder="Имя">
            <button class="btn btn-yes" id="reg-btn">Зарегистрировать ученика</button>
            <button class="btn save-btn" id="save-btn">Сохранить в файл</button>
            <button class="btn" id="students-btn">Список учеников</button>
        </div>
        <p id="message"></p>
        <div id="session-buttons" style="display:none">
            <button class="btn" id="logout-btn">Выйти</button>
            <button class="btn" id="change-pass-button">Сменить пароль</button>
        </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
