<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Adsum: Смена пароля</title>
        <link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="icon.png">
    </head>
    <body>
        <div class="container">
            <h1>Смена пароля</h1>
			<div class="bubble">
				<input class="name-input" id="old-pass" type="password" placeholder="Текущий пароль">
				<input class="name-input" id="new-pass" type="password" placeholder="Новый пароль (минимум 8 символов)">
				<div class="select-row">
					<button class="btn change-btn" id="change-btn">Сменить пароль</button>
					<button class="btn" id="back-btn">Назад</button>
				</div>
			<div>
            <p id="message"></p>
        </div>
		<script src="layout.js"></script>
        <script src="change.js"></script>
    </body>
</html>
